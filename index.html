<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية أمين | لوحة التحكم والمنصة الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #2563eb;
            --accent: #d97706;
            --bg: #090d16;
            --surface: rgba(30, 41, 59, 0.85);
            --surface-solid: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(51, 65, 85, 0.7);
            --green: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 70%);
        }

        .container { width: 100%; max-width: 600px; }

        header { text-align: center; margin: 15px 0; }
        h1 { font-size: 1.8rem; color: #60a5fa; margin-bottom: 4px; font-weight: 900; }
        .subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; }

        /* شريط التنقل بين المنصة ولوحة التحكم */
        .nav-switch {
            display: flex; gap: 8px; margin-bottom: 20px;
            background: rgba(15, 23, 42, 0.9); padding: 6px;
            border-radius: 14px; border: 1px solid var(--border);
        }
        .switch-btn {
            flex: 1; background: transparent; border: none; color: var(--text-muted);
            padding: 10px; border-radius: 10px; font-size: 0.85rem; font-weight: 700;
            cursor: pointer; transition: all 0.3s; text-align: center;
        }
        .switch-btn.active { background: var(--secondary); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4); }

        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--surface); backdrop-filter: blur(12px);
            border-radius: 18px; padding: 20px; border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); margin-bottom: 15px;
        }

        .section-title {
            font-size: 1rem; color: #60a5fa; margin-bottom: 12px; font-weight: bold;
            border-right: 3px solid var(--accent); padding-right: 8px;
        }

        /* نماذج الإدخال الخاصة بلوحة التحكم */
        .form-group { margin-bottom: 12px; text-align: right; }
        .form-label { display: block; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 5px; font-weight: bold; }
        .form-input, .form-select {
            width: 100%; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border);
            padding: 10px 12px; border-radius: 10px; color: white; font-size: 0.85rem; outline: none;
        }
        .form-input:focus, .form-select:focus { border-color: var(--secondary); }

        .btn {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            background: var(--secondary); color: white; text-decoration: none;
            padding: 12px; border-radius: 12px; font-weight: 700; font-size: 0.85rem;
            border: none; transition: all 0.2s; text-align: center; cursor: pointer; width: 100%;
        }
        .btn:hover { background: #1d4ed8; transform: translateY(-1px); }
        .btn-green { background: var(--green); }
        .btn-green:hover { background: #059669; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-box { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); padding: 15px; border-radius: 14px; text-align: center; }
        .stat-num { font-size: 1.4rem; font-weight: 900; color: #60a5fa; margin-top: 4px; }

        footer { margin-top: 15px; font-size: 0.75rem; color: var(--text-muted); text-align: center; padding-bottom: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>أكاديمية أمين</h1>
            <p class="subtitle">المنصة التعليمية الذكية - لوحة الإدارة والتحكم</p>
        </header>

        <!-- تبديل العرض بين المنصة ولوحة التحكم -->
        <div class="nav-switch">
            <button class="switch-btn active" onclick="switchView('student', this)">🎓 واجهة الطالب</button>
            <button class="switch-btn" onclick="switchView('admin', this)">⚙️ لوحة التحكم والإدارة</button>
        </div>

        <!-- 1. واجهة الطالب -->
        <div id="studentView" class="view-section active">
            <div class="card">
                <div class="section-title">📖 الأطوار التعليمية المتاحة</div>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button class="btn" onclick="alert('جاري فتح الطور المتوسط...')">التعليم المتوسط (CEM) - مفعل</button>
                    <button class="btn" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border);" onclick="alert('التعليم الثانوي قريباً')">التعليم الثانوي (BAC) - قريباً</button>
                    <button class="btn" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border);" onclick="alert('التعليم الابتدائي قريباً')">التعليم الابتدائي - قريباً</button>
                </div>
            </div>
        </div>

        <!-- 2. لوحة التحكم والإدارة (Admin Dashboard) -->
        <div id="adminView" class="view-section">
            <div class="stats-grid">
                <div class="stat-box">
                    <span style="font-size: 0.8rem; color: var(--text-muted);">إجمالي الدروس</span>
                    <div class="stat-num" id="totalLessons">12</div>
                </div>
                <div class="stat-box">
                    <span style="font-size: 0.8rem; color: var(--text-muted);">الأطوار المفعلة</span>
                    <div class="stat-num">3</div>
                </div>
            </div>

            <div class="card">
                <div class="section-title">➕ إضافة درس أو محتوى جديد</div>
                <div class="form-group">
                    <label class="form-label">الطور التعليمي</label>
                    <select id="stageSelect" class="form-select">
                        <option value="الابتدائي">التعليم الابتدائي</option>
                        <option value="المتوسط">التعليم المتوسط</option>
                        <option value="الثانوي">التعليم الثانوي</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">عنوان الدرس / المادة</label>
                    <input type="text" id="lessonTitleInput" class="form-input" placeholder="مثال: الدوال العددية - رياضيات ثالثة ثانوي">
                </div>
                <button class="btn btn-green" onclick="addNewLesson()">حفظ ونشر الدرس في المنصة</button>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 - Amin-Dz-Edsmart | نظام إدارة المحتوى الداخلي</p>
        </footer>
    </div>

    <script>
        function switchView(viewName, btnElement) {
            document.querySelectorAll('.switch-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));

            btnElement.classList.add('active');
            if(viewName === 'student') {
                document.getElementById('studentView').classList.add('active');
            } else {
                document.getElementById('adminView').classList.add('active');
            }
        }

        let lessonCount = 12;
        function addNewLesson() {
            let title = document.getElementById('lessonTitleInput').value.trim();
            let stage = document.getElementById('stageSelect').value;
            if(title === "") {
                alert("يرجى إدخال عنوان الدرس أولاً!");
                return;
            }
            lessonCount++;
            document.getElementById('totalLessons').innerText = lessonCount;
            alert(`تم بنجاح إضافة الدرس: "${title}" ضمن طور ${stage} ونشره فوراً في النظام!`);
            document.getElementById('lessonTitleInput').value = "";
        }
    </script>
</body>
</html>

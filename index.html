<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية أمين | البوابة الشاملة لجميع المواد والمستويات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #2563eb;
            --accent: #d97706;
            --bg: #090d16;
            --surface: rgba(30, 41, 59, 0.85);
            --surface-solid: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(51, 65, 85, 0.7);
            --green: #10b981;
            --purple: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 70%);
        }

        .container { width: 100%; max-width: 640px; }

        header { text-align: center; margin: 15px 0; }
        h1 { font-size: 1.8rem; color: #60a5fa; margin-bottom: 4px; font-weight: 900; }
        .subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; }

        /* شريط البحث السريع */
        .search-box { position: relative; margin-bottom: 20px; }
        .search-input {
            width: 100%; background: var(--surface); border: 1px solid var(--border);
            padding: 11px 14px 11px 40px; border-radius: 12px; color: white;
            font-size: 0.85rem; outline: none; backdrop-filter: blur(10px);
        }
        .search-input:focus { border-color: var(--secondary); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        /* بطاقات الأطوار والمستويات */
        .card {
            background: var(--surface); backdrop-filter: blur(12px);
            border-radius: 18px; padding: 18px; border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); margin-bottom: 15px;
        }

        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px;
        }
        .stage-title { font-size: 1.05rem; color: #f1f5f9; font-weight: 700; }
        .stage-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 6px; font-weight: bold; background: rgba(37, 99, 235, 0.2); color: #60a5fa; border: 1px solid rgba(37, 99, 235, 0.4); }

        .level-group { margin: 10px 0; }
        .level-title { font-size: 0.83rem; color: #60a5fa; font-weight: bold; margin-bottom: 6px; border-right: 2px solid var(--accent); padding-right: 6px; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            background: rgba(255, 255, 255, 0.04); color: var(--text); text-decoration: none;
            padding: 9px 8px; border-radius: 10px; font-weight: 700; font-size: 0.78rem;
            border: 1px solid var(--border); transition: all 0.2s; text-align: center; cursor: pointer;
        }
        .btn:hover { background: rgba(37, 99, 235, 0.2); border-color: var(--secondary); }
        .btn-accent { background: linear-gradient(135deg, var(--accent), #b45309); border: none; color: white; }
        .btn-primary { background: linear-gradient(135deg, var(--secondary), #1d4ed8); border: none; color: white; }
        .btn-full { grid-column: span 2; }

        /* نافذة منبثقة لعرض محتوى المادة أو الدرس */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);
            justify-content: center; align-items: center; z-index: 1000; padding: 20px;
        }
        .modal-content {
            background: var(--surface-solid); border: 1px solid var(--border);
            padding: 22px; border-radius: 18px; width: 100%; max-width: 400px; text-align: right;
            max-height: 85vh; overflow-y: auto;
        }
        .modal-content h3 { color: #60a5fa; margin-bottom: 8px; font-size: 1.1rem; text-align: center; }
        .modal-content p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px; line-height: 1.5; }
        .modal-btn { background: var(--secondary); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }

        footer { margin-top: 15px; font-size: 0.75rem; color: var(--text-muted); text-align: center; padding-bottom: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>أكاديمية أمين</h1>
            <p class="subtitle">البوابة الشاملة لجميع المواد، المستويات، والمناهج في الجزائر</p>
        </header>

        <!-- شريط البحث الفوري -->
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن مادة، درس، أو سنة دراسية..." onkeyup="filterContent()">
        </div>

        <!-- 1. التعليم الابتدائي -->
        <div class="card" data-key="ابتدائي أولى ثانية ثالثة رابعة خامسة رياضيات عربية فرنسية">
            <div class="card-header">
                <span class="stage-title">🎒 التعليم الابتدائي</span>
                <span class="stage-badge">5 مستويات</span>
            </div>
            
            <div class="level-group">
                <div class="level-title">السنة الخامسة ابتدائي (نهاية الابتدائي)</div>
                <div class="btn-grid">
                    <button class="btn btn-primary" onclick="openSubjectModal('السنة 5 ابتدائي', 'اللغة العربية', ['قواعد إعراب الجمل المفيدة', 'التعبير الكتابي وإنتاج الوضعيات', 'فهم النص والأسئلة'])">📖 اللغة العربية</button>
                    <button class="btn btn-accent" onclick="openSubjectModal('السنة 5 ابتدائي', 'الرياضيات', ['الأعداد الكسرية والعشرية', 'التناسبية والنسب المئوية', 'المساحات والمحيطات الهندسية'])">📐 الرياضيات</button>
                    <button class="btn" onclick="openSubjectModal('السنة 5 ابتدائي', 'الفرنسية', ['Les adjectifs qualificatifs', 'Le présent de l\'indicatif', 'Production écrite'])">🇫🇷 الفرنسية</button>
                    <button class="btn" onclick="openSubjectModal('السنة 5 ابتدائي', 'التربية الإسلامية والمدنية', ['أركان الإيمان والإحسان', 'مؤسسات الدولة الجزائرية'])">islamic التربية الإسلامية</button>
                </div>
            </div>
            <div class="level-group">
                <div class="level-title">باقي سنوات الابتدائي (1، 2، 3، 4)</div>
                <div class="btn-grid">
                    <button class="btn btn-full" onclick="openSubjectModal('التعليم الابتدائي', 'الأساسيات والمواد المشتركة', ['الحساب الذهني المبسط', 'القراءة والكتابة العربية', 'التربية العلمية والتكنولوجية'])">📚 استعراض مواد سنوات (1 إلى 4)</button>
                </div>
            </div>
        </div>

        <!-- 2. التعليم المتوسط -->
        <div class="card" data-key="متوسط أولى ثانية ثالثة رابعة bem رياضيات فيزياء علوم عربية إنجليزية تاريخ جغرافيا">
            <div class="card-header">
                <span class="stage-title">📖 التعليم المتوسط (CEM)</span>
                <span class="stage-badge">BEM مفعل</span>
            </div>
            
            <div class="level-group">
                <div class="level-title">⭐ السنة الرابعة متوسط (BEM - المواد الكاملة)</div>
                <div class="btn-grid">
                    <button class="btn btn-accent" onclick="openSubjectModal('السنة 4 متوسط', 'الرياضيات', ['قاسم عدد طبيعي (PGCD)', 'الحساب على الجذور التربيعية', 'النشر والتحليل والمعادلات'])">📐 الرياضيات (PGCD)</button>
                    <button class="btn btn-primary" onclick="openSubjectModal('السنة 4 متوسط', 'الفيزياء وتكنولوجيا', ['الشاردة والمحلول الشاردي', 'الميدان المغناطيسي والتحريض', 'الأمن الكهربائي'])">⚡ الفيزياء وتكنولوجيا</button>
                    <button class="btn" onclick="openSubjectModal('السنة 4 متوسط',

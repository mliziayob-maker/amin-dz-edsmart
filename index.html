<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية أمين | Amin-Dz-Edsmart</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #2563eb;
            --accent: #d97706;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .logo-area {
            margin-bottom: 25px;
        }

        h1 {
            font-size: 1.8rem;
            color: #60a5fa;
            margin-bottom: 8px;
            font-weight: 900;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .card {
            background: var(--surface);
            border-radius: 20px;
            padding: 28px 20px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 12px;
            color: white;
        }

        .card p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, var(--secondary), #1d4ed8);
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s, background 0.2s;
            margin-bottom: 12px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-accent {
            background: linear-gradient(135deg, var(--accent), #b45309);
            box-shadow: 0 4px 12px rgba(217, 119, 6ונת, 0.4);
        }

        .features-list {
            text-align: right;
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.88rem;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <h1>Amin-Dz-Edsmart</h1>
            <p class="subtitle">المنصة الذكية للتعليم حسب البرنامج الجزائري</p>
        </div>

        <div class="card">
            <h2>مرحباً بك في مستقبل التعلم</h2>
            <p>مدرسة افتراضية مدعومة بالذكاء الاصطناعي، مصممة خصيصاً لمرافقة تلاميذ الأطور التعليمية في الجزائر نحو التفوق والتميز.</p>
            
            <!-- زر الانتقال للدرس التجريبي الأول -->
            <a href="lesson.html" class="btn btn-accent">

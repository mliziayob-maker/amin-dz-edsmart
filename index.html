<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية أمين | المنصة الذكية الحيّة للمناهج الجزائرية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #2563eb;
            --accent: #d97706;
            --bg: #090d16;
            --surface: rgba(30, 41, 59, 0.85);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(51, 65, 85, 0.7);
            --purple: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 70%);
        }

        .container { width: 100%; max-width: 680px; }

        header { text-align: center; margin: 15px 0 20px 0; }
        h1 { font-size: 1.9rem; color: #60a5fa; margin-bottom: 4px; font-weight: 900; }
        .subtitle { font-size: 0.85rem; color: var(--text-muted); }

        .card {
            background: var(--surface); backdrop-filter: blur(12px);
            border-radius: 18px; padding: 20px; border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); margin-bottom: 20px;
        }

        .section-title {
            font-size: 1rem; color: #60a5fa; margin-bottom: 16px; font-weight: bold;
            border-right: 3px solid var(--accent); padding-right: 8px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .form-group { margin-bottom: 14px; text-align: right; }
        .form-label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; font-weight: bold; }
        .form-select, .form-input {
            width: 100%; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border);
            padding: 12px; border-radius: 12px; color: white; font-size: 0.88rem; outline: none;
        }
        .form-select:focus, .form-input:focus { border-color: var(--secondary); box-shadow: 0 0 8px rgba(37, 99, 235, 0.3); }

        .btn-purple {
            background: linear-gradient(135deg, var(--purple), #6d28d9); color: white;
            padding: 13px; border-radius: 12px; font-weight: 700; font-size: 0.9rem;
            border: none; cursor: pointer; width: 100%; margin-top: 10px;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.3);
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }

        .result-box {
            display: none; background: rgba(15, 23, 42, 0.95); border: 1px solid var(--purple);
            border-radius: 18px; padding: 22px; margin-top: 20px; line-height: 1.7;
        }
        .result-box.active { display: block; animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .badge { font-size: 0.75rem; background: rgba(139, 92, 246, 0.2); color: #c084fc; padding: 3px 10px; border-radius: 8px; border: 1px solid rgba(139, 92, 246, 0.4); display: inline-block; margin-bottom: 10px; }
        
        .loader {
            display: none; border: 3px solid rgba(255,255,255,0.1); border-radius: 50%;
            border-top: 3px solid var(--purple); width: 20px; height: 20px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        footer { margin-top: 20px; font-size: 0.75rem; color: var(--text-muted); text-align: center; padding-bottom: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>أكاديمية أمين</h1>
            <p class="subtitle">المنصة التعليمية التفاعلية الذكية للمناهج الجزائرية</p>
        </header>

        <!-- إعداد مفتاح API -->
        <div class="card" style="border-color: rgba(217, 119, 6, 0.5);">
            <div class="section-title">
                <span>🔑 إعداد مفتاح API المجاني (Google Gemini)</span>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <input type="text" id="apiKeyInput" class="form-input" placeholder="ألصق مفتاح Gemini API هنا...">
                <span style="font-size: 0.72rem; color: var(--text-muted); display: block; margin-top: 4px;">* يُحفظ المفتاح محلياً في متصفحك تلقائياً.</span>
            </div>
        </div>

        <!-- محرك الطلب والتوليد الحي -->
        <div class="card">
            <div class="section-title">
                <span>📚 مولّد الدروس والخرائط والتمارين التفاعلية</span>
                <span style="font-size: 0.7rem; background: rgba(16, 185, 129, 0.2); color: #34d399; padding: 2px 8px; border-radius: 6px;">توليد حي حقيقي</span>
            </div>

            <div class="form-group">
                <label class="form-label">1. الطور التعليمي</label>
                <select id="phaseSelect" class="form-select" onchange="updateLevels()">
                    <option value="">-- اختر الطور الدراسي --</option>
                    <option value="primary">التعليم الابتدائي</option>
                    <option value="middle">التعليم المتوسط (CEM)</option>
                    <option value="secondary">التعليم الثانوي (BAC)</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">2. المستوى / السنة الدراسية</label>
                <select id="levelSelect" class="form-select" disabled>
                    <option value="">-- اختر الطور أولاً --</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">3. المادة التعليمية</label>
                <input type="text" id="subjectInput" class="form-input" placeholder="مثال: رياضيات، علوم، فيزياء...">
            </div>

            <div class="form-group">
                <label class="form-label">4. عنوان الدرس المطلوب بالضبط</label>
                <input type="text" id="lessonTitleInput" class="form-input" placeholder="مثال: انقسام الخلية، القاسم المشترك الأكبر...">
            </div>

            <button class="btn-purple" onclick="generateLiveLesson()">
                <div id="loader" class="loader"></div>
                <span id="btnText">✨ توليد الدرس والشرح والخريطة والتمارين حياً</span>
            </button>
        </div>

        <!-- شاشة عرض المحتوى المتولد حياً -->
        <div id="outputContainer" class="result-box">
            <span id="resBadge" class="badge"></span>
            <h2 id="resTitle" style="color: #60a5fa; font-size: 1.25rem; margin-bottom: 15px;"></h2>
            <div id="resContent" style="font-size: 0.88rem; color: #e2e8f0; line-height: 1.8;"></div>
        </div>

        <footer>
            <p>&copy; 2026 - أكاديمية أمين | المحرك الذكي للمناهج الجزائرية</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        });

        const levelsData = {
            primary: ["السنة الأولى ابتدائي", "السنة الثانية ابتدائي", "السنة الثالثة ابتدائي", "السنة الرابعة ابتدائي", "السنة الخامسة ابتدائي"],
            middle: ["السنة الأولى متوسط", "السنة الثانية متوسط", "السنة الثالثة متوسط", "السنة الرابعة متوسط (BEM)"],
            secondary: ["السنة 1 ثانوي - جذع مشترك علوم", "السنة 2 ثانوي - علوم تجريبية", "السنة 3 ثانوي - علوم تجريبية (BAC)", "السنة 3 ثانوي - رياضيات (BAC)"]
        };

        function updateLevels() {
            const phase = document.getElementById('phaseSelect').value;
            const levelSelect = document.getElementById('levelSelect');
            levelSelect.innerHTML = '<option value="">-- اختر المستوى --</option>';

            if (phase && levelsData[phase]) {
                levelSelect.disabled = false;
                levelsData[phase].forEach(lvl => {
                    const opt = document.createElement('option');
                    opt.value = lvl; opt.innerText = lvl;
                    levelSelect.appendChild(opt);
                });
            } else {
                levelSelect.disabled = true;
            }
        }

            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const level = document.getElementById('levelSelect').value;
            const subject = document.getElementById('subjectInput').value.trim();
            const title = document.getElementById('lessonTitleInput').value.trim();

            if (!apiKey) {
                alert("يرجى إدخال مفتاح Gemini API في الخانة المخصصة!");
                return;
            }
            if (!level || !subject || !title) {

                return;
